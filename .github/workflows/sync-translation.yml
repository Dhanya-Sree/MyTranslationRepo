name: Sync Translation

on:
  push:
    branches:
      - master-translation
    paths:
      - translation.json

  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT }}

      - name: Fetch translation.json from master-translation
        run: |
          git fetch origin master-translation
          git checkout origin/master-translation -- translation.json

      - name: Commit and push to master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add translation.json

          if git diff --cached --quiet; then
            echo "No changes to sync."
            exit 0
          fi

          git commit -m "chore: sync translation.json from master-translation"

          git remote set-url origin \
            https://x-access-token:${{ secrets.SYNC_PAT }}@github.com/${{ github.repository }}.git

          git push origin master
