name: Sync Translation

on:
  push:
    branches:
      - master-translation
    paths:
      - translation.json

  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      TRANSLATION_FILE: translation.json
      TARGET_BRANCH: master

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: master-translation
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT }}

      - name: Save translation file
        run: |
          cp $TRANSLATION_FILE /tmp/translation.json

      - name: Switch to master
        run: |
          git fetch origin $TARGET_BRANCH
          git checkout -B $TARGET_BRANCH origin/$TARGET_BRANCH

      - name: Update file
        run: |
          cp /tmp/translation.json $TRANSLATION_FILE

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add $TRANSLATION_FILE

          if git diff --cached --quiet; then
            echo "No changes found"
            exit 0
          fi

          git commit -m "Sync translation.json from master-translation"

      - name: Push changes
        run: |
          git remote set-url origin \
          https://x-access-token:${{ secrets.SYNC_PAT }}@github.com/${{ github.repository }}.git

          git push origin $TARGET_BRANCH
