name: Sync Translation from master-translation to master

# ──────────────────────────────────────────────────────────────────────────────
# Trigger: any push to the master-translation branch that touches the
#          English translation file.  Also supports manual dispatch.
# ──────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - master-translation
    paths:
      - 'translation.json'
  workflow_dispatch:   # allow manual runs from the Actions tab

permissions:
  contents: write      # needed to push the updated file to master

jobs:
  sync-and-notify:
    runs-on: ubuntu-latest
    env:
      TRANSLATION_FILE: translation.json
      TARGET_BRANCH: master

    steps:
      # ── 1. Check out the master-translation branch (source) ────────────────
      - name: Checkout master-translation (source)
        uses: actions/checkout@v4
        with:
          ref: master-translation
          fetch-depth: 0          # full history so we can diff later
          token: ${{ secrets.SYNC_PAT }}

      # ── 2. Capture the new keys added in this commit ────────────────────────
      - name: Identify newly added keys
        id: diff
        run: |
          # Compare the file in master-translation vs master
          git fetch origin master --depth=1

          # Produce a human-readable list of added lines for the Slack message
          ADDED_LINES=$(git diff origin/master -- "$TRANSLATION_FILE" \
            | grep '^+' \
            | grep -v '^+++' \
            | sed 's/^+//' \
            | head -40)

          # Store as a multiline output (escape for GitHub Actions)
          echo "added_lines<<EOF" >> "$GITHUB_OUTPUT"
          echo "$ADDED_LINES"     >> "$GITHUB_OUTPUT"
          echo "EOF"              >> "$GITHUB_OUTPUT"

      # ── 3. Copy the updated file into the master branch ────────────────────
      - name: Push updated translation.json to master
        run: |
          # Stash the updated file
          cp "$TRANSLATION_FILE" /tmp/translation.json

          # Switch to master
          git fetch origin master
          git checkout master

          # Overwrite only the translation file
          cp /tmp/translation.json "$TRANSLATION_FILE"

          # Commit only if there are actual changes
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "$TRANSLATION_FILE"

          if git diff --cached --quiet; then
            echo "No changes to commit – translation.json is already up to date."
            echo "SKIPPED=true" >> "$GITHUB_ENV"
          else
            SOURCE_SHA="${{ github.sha }}"
            git commit -m "chore(i18n): sync translation.json from master-translation [${SOURCE_SHA:0:7}]"
            git push origin master
            echo "SKIPPED=false" >> "$GITHUB_ENV"
          fi

      # ── 4. Send Slack notification ──────────────────────────────────────────
      - name: Notify Slack – translation synced
        if: env.SKIPPED == 'false'
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          payload: |
            {
              "text": ":white_check_mark: *Translation file synced to `master`*",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "Translation Sync - controller-core-ui",
                    "emoji": true
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Status:*\n:white_check_mark: Synced successfully"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Triggered by commit:*\n`${{ github.sha }}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Source branch:*\n`master-translation`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Target branch:*\n`master`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Author:*\n${{ github.actor }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Notify:*\ndhanya.radhakrishnan@ibm.com"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*New / changed keys (first 40 lines):*\n```${{ steps.diff.outputs.added_lines }}```"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "View commit on GitHub" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
                    },
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "View translation.json on master" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/blob/master/workflow/src/assets/locales/en/translation.json"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

      # ── 5. Notify Slack – no changes (optional informational step) ──────────
      - name: Notify Slack – no changes detected
        if: env.SKIPPED == 'true'
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          payload: |
            {
              "text": ":information_source: Translation sync triggered but *no new changes* found – `master` is already up to date."
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}